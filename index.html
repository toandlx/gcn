<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#12355B">
<title>Xác minh giấy chứng nhận giáo viên — Sở Xây dựng Bắc Ninh</title>
<style>
  :root {
    --ink: #12355B; --ink-2: #1C4878; --ink-soft: #E6EEF7;
    --bg: #F2F4F7; --surface: #fff; --line: #DAE1E9;
    --text: #17212B; --muted: #5E6D7D;
    --ok: #1E7B4F; --ok-bg: #E5F3EB; --seal: #B3261E; --seal-bg: #FBEAE8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  header.top {
    background: var(--ink); color: #fff; padding: 18px 18px 54px;
  }
  .brand { display: flex; align-items: center; gap: 12px; max-width: 560px; margin: 0 auto; }
  .brand .mark { width: 40px; height: 40px; border-radius: 10px; background: #fff; position: relative; flex: none; }
  .brand .mark::before { content: ""; position: absolute; left: 8px; top: 8px; width: 9px; height: 13px; border: 2px solid var(--ink); border-radius: 1px; }
  .brand .mark::after { content: ""; position: absolute; right: 6px; bottom: 6px; width: 11px; height: 11px; border: 2.5px solid var(--seal); border-radius: 50%; }
  .brand b { display: block; font-size: 15px; letter-spacing: .2px; }
  .brand span { display: block; font-size: 13px; color: #A6BAD1; }
  main { max-width: 560px; margin: -38px auto 0; padding: 0 14px 28px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .status { display: flex; gap: 12px; align-items: center; padding: 14px 16px; }
  .status .dot { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .status .dot svg { width: 22px; height: 22px; }
  .status.valid .dot { background: var(--ok); }
  .status.revoked .dot { background: var(--seal); }
  .status b { display: block; font-size: 17px; }
  .status.valid b { color: var(--ok); }
  .status.revoked b { color: var(--seal); }
  .status span { font-size: 13.5px; color: var(--muted); }
  .profile { margin-top: 12px; padding: 16px; display: flex; gap: 14px; align-items: flex-start; }
  .photo { width: 96px; aspect-ratio: 3 / 4; border-radius: 8px; overflow: hidden; background: #EEF2F6; border: 1px solid var(--line); flex: none; display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .who h1 { font-size: 21px; line-height: 1.25; margin: 2px 0 6px; }
  .chip { display: inline-block; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--ink-soft); border-radius: 999px; padding: 3px 10px; margin: 0 4px 4px 0; }
  .details { margin-top: 12px; padding: 4px 16px; }
  .row { display: grid; grid-template-columns: 42% 58%; gap: 10px; padding: 11px 0; border-bottom: 1px solid #EEF1F5; }
  .row:last-child { border-bottom: 0; }
  .row dt { color: var(--muted); font-size: 14px; }
  .row dd { margin: 0; font-weight: 600; font-size: 15px; word-break: break-word; }
  .actions { margin-top: 12px; }
  button.primary { width: 100%; border: 0; border-radius: 12px; background: var(--ink); color: #fff; font: 600 16px/1 inherit; font-family: inherit; padding: 15px; cursor: pointer; }
  button.primary:active { background: var(--ink-2); }
  button:focus-visible { outline: 3px solid #7FA8D6; outline-offset: 2px; }
  .note { font-size: 12.5px; color: var(--muted); text-align: center; margin: 16px 6px 0; }
  .center { text-align: center; padding: 34px 20px; }
  .center h2 { font-size: 19px; margin: 12px 0 6px; }
  .center p { color: var(--muted); margin: 0; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--ink-soft); border-top-color: var(--ink); margin: 0 auto; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  .big-icon { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto; }
  .big-icon svg { width: 30px; height: 30px; }
  /* Bản dựng tờ giấy */
  .sheet-wrap { position: fixed; inset: 0; background: #0E1A28; display: none; flex-direction: column; z-index: 10; }
  .sheet-wrap.open { display: flex; }
  .sheet-bar { display: flex; justify-content: space-between; align-items: center; color: #fff; padding: 12px 14px; font-size: 14px; }
  .sheet-bar button { background: #fff; color: var(--ink); border: 0; border-radius: 10px; padding: 9px 14px; font: 600 14px inherit; font-family: inherit; cursor: pointer; }
  .sheet-area { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 8px; }
  .sheet-scale { position: relative; flex: none; }
  .sheet { position: absolute; left: 0; top: 0; width: 2100px; height: 1480px; background: #fff; transform-origin: 0 0; color: #0a0a0a;
           font-family: "Times New Roman", Tinos, "Liberation Serif", "Noto Serif", Georgia, serif; overflow: hidden; }
  .sheet .t { position: absolute; white-space: nowrap; line-height: 1; }
  .sheet .p { position: absolute; white-space: normal; text-align: justify; }
  .sheet .b { font-weight: 700; }
  .sheet .i { font-style: italic; }
  .sheet .ul { position: absolute; height: 0; border-top: 2.6px solid #0a0a0a; }
  .sheet .ph { position: absolute; border: 3px solid #355596; overflow: hidden; background: #fafafa; }
  .sheet .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sheet .wm { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%) rotate(-18deg); font: 700 118px/1 "Segoe UI", Arial, sans-serif; color: rgba(23, 85, 168, .10); letter-spacing: 6px; white-space: nowrap; pointer-events: none; }
  .sheet .signed { position: absolute; width: 360px; text-align: center; }
  .sheet .signed .tick { width: 120px; height: 120px; border-radius: 50%; background: #1E7B4F; margin: 0 auto; display: grid; place-items: center; box-shadow: 0 0 0 10px rgba(30, 123, 79, .14); }
  .sheet .signed .tick svg { width: 74px; height: 74px; }
  .sheet .signed b { display: block; margin-top: 22px; font: 700 44px/1 "Segoe UI", Arial, sans-serif; color: #1E7B4F; letter-spacing: .5px; }
  .sheet .qr { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; background: #fff; }
  .sheet .qr-cap { position: absolute; text-align: center; white-space: nowrap; font-style: italic; transform: translateX(-50%); }
  .sheet .qr { cursor: zoom-in; }
  .qr-zoom { position: fixed; inset: 0; background: #fff; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
  .qr-zoom.open { display: flex; }
  .qr-zoom img { image-rendering: pixelated; image-rendering: crisp-edges; width: min(88vw, 78vh); height: min(88vw, 78vh); }
  .qr-zoom p { margin: 0; color: #17212B; font-size: 15px; text-align: center; }
  .qr-zoom button { border: 0; border-radius: 10px; background: var(--ink); color: #fff; font: 600 15px inherit; font-family: inherit; padding: 11px 22px; cursor: pointer; }
  .rotate-hint { color: #CBD6E2; font-size: 13px; text-align: center; padding: 4px 12px 14px; }
  @media (orientation: landscape) { .rotate-hint { display: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="mark" aria-hidden="true"></div>
    <div><b>SỞ XÂY DỰNG BẮC NINH</b><span>Xác minh giấy chứng nhận giáo viên dạy thực hành lái xe</span></div>
  </div>
</header>
<main id="app">
  <div class="card center" id="loading">
    <div class="spinner" role="status" aria-label="Đang tải"></div>
    <h2>Đang kiểm tra giấy chứng nhận…</h2>
    <p>Vui lòng đợi trong giây lát.</p>
  </div>
</main>

<div class="sheet-wrap" id="sheetWrap" role="dialog" aria-modal="true" aria-label="Bản dựng giấy chứng nhận">
  <div class="sheet-bar"><span>Bản xác minh điện tử</span><button type="button" id="closeSheet">Đóng</button></div>
  <div class="sheet-area" id="sheetArea"><div class="sheet-scale" id="sheetScale"><div class="sheet" id="sheet"></div></div></div>
  <div class="rotate-hint">Xoay ngang điện thoại để xem rõ hơn. Chạm vào mã QR để phóng to.</div>
</div>
<div class="qr-zoom" id="qrZoom" role="dialog" aria-modal="true" aria-label="Mã QR quét không cần mạng">
  <img id="qrZoomImg" alt="Mã QR quét không cần mạng">
  <p>Mã QR quét không cần mạng: chứa đầy đủ thông tin in trên giấy chứng nhận.</p>
  <button type="button" id="qrZoomClose">Đóng</button>
</div>

<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>';
  var ICON_Q = '<svg viewBox="0 0 24 24" fill="none" stroke="#12355B" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>';

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function message(kind, title, text) {
    var color = kind === "error" ? "var(--seal-bg)" : "var(--ink-soft)";
    var icon = kind === "error" ? ICON_X.replace('stroke="#fff"', 'stroke="#B3261E"') : ICON_Q;
    app.innerHTML = '<div class="card center"><div class="big-icon" style="background:' + color + '">' + icon +
      '</div><h2>' + esc(title) + '</h2><p>' + esc(text) + '</p></div>';
  }
  function b64urlToBytes(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  var hash = (location.hash || "").replace(/^#/, "");
  var m = /^([a-z2-9]{16})\.([A-Za-z0-9_-]{43})$/.exec(hash);
  if (!m) {
    message("info", "Hãy quét mã QR trên giấy chứng nhận",
      "Trang này dùng để xác minh giấy chứng nhận giáo viên do Sở Xây dựng Bắc Ninh cấp. Mở trang bằng cách quét mã “Xác minh online” in trên giấy.");
    return;
  }
  if (!window.crypto || !window.crypto.subtle) {
    message("error", "Trình duyệt chưa hỗ trợ", "Hãy mở link bằng Chrome, Safari hoặc Zalo phiên bản mới.");
    return;
  }
  var id = m[1], keyBytes = b64urlToBytes(m[2]);

  fetch("h/" + id + ".txt", { cache: "no-store" })
    .then(function (r) {
      if (r.status === 404) throw { code: "notfound" };
      if (!r.ok) throw { code: "net" };
      return r.text();
    })
    .then(function (text) {
      text = text.trim();
      if (text.indexOf("GCN1.") !== 0) throw { code: "bad" };
      var blob = b64urlToBytes(text.slice(5));
      return crypto.subtle.importKey("raw", keyBytes, { name: "AES-GCM" }, false, ["decrypt"]).then(function (key) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: blob.slice(0, 12), additionalData: new TextEncoder().encode(id) }, key, blob.slice(12));
      }).catch(function () { throw { code: "bad" }; });
    })
    .then(function (plain) {
      render(JSON.parse(new TextDecoder().decode(plain)));
    })
    .catch(function (e) {
      var code = e && e.code;
      if (code === "notfound") message("error", "Không tìm thấy giấy chứng nhận", "Mã QR không có trong hệ thống. Nếu giấy vừa được cấp, hãy thử lại sau vài phút.");
      else if (code === "bad") message("error", "Mã QR không hợp lệ", "Không giải mã được dữ liệu. Mã QR có thể bị sửa đổi hoặc chụp không đầy đủ.");
      else message("error", "Không tải được dữ liệu", "Kiểm tra kết nối Internet rồi tải lại trang.");
    });

  function render(d) {
    var valid = d.status !== "revoked";
    var photo = d.photo ? '<img alt="Ảnh chân dung" src="data:image/jpeg;base64,' + d.photo + '">' : "Chưa có ảnh";
    var period = (d.begin && d.end) ? ("Từ " + d.begin + " đến " + d.end) : d.training_time;
    var rows = [
      ["Ngày sinh", d.dob], ["Số CCCD", d.cccd], ["Hạng tập huấn", d.training_class], ["Thời gian tập huấn", period],
      ["Số giấy chứng nhận", d.cert], ["Quyết định cấp", d.decision], ["Ngày cấp", d.issue_date], ["Cơ quan cấp", d.issuer]
    ];
    app.innerHTML =
      '<div class="card status ' + (valid ? "valid" : "revoked") + '"><div class="dot">' + (valid ? ICON_OK : ICON_X) + '</div><div>' +
        (valid ? '<b>Giấy chứng nhận hợp lệ</b><span>Còn hiệu lực theo dữ liệu của Sở Xây dựng Bắc Ninh</span>'
               : '<b>Giấy chứng nhận đã bị thu hồi</b><span>Giấy chứng nhận này không còn giá trị</span>') +
      '</div></div>' +
      '<div class="card profile"><div class="photo">' + photo + '</div><div class="who"><h1>' + esc(d.name) + '</h1>' +
        '<span class="chip">GCN ' + esc(d.cert) + '</span><span class="chip">Hạng ' + esc(d.training_class) + '</span></div></div>' +
      '<div class="card details"><dl style="margin:0">' + rows.map(function (r) {
        return '<div class="row"><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>';
      }).join("") + '</dl></div>' +
      (valid ? '<div class="actions"><button class="primary" type="button" id="openSheet">Xem dạng giấy chứng nhận</button></div>' : "") +
      '<p class="note">Cập nhật ' + esc(d.updated) + '. Dữ liệu được mã hóa; chỉ người có mã QR trên giấy chứng nhận mới xem được.</p>';
    if (valid) {
      buildSheet(d);
      document.getElementById("openSheet").addEventListener("click", openSheet);
    }
  }

  // ---------- bản dựng tờ giấy A5 ngang (đơn vị: 1 cm = 100 px) ----------
  var PT = 100 * 2.54 / 72;
  function txt(sheet, html, x, base, pt, cls) {
    var e = document.createElement("div");
    e.className = "t " + (cls || "");
    e.style.fontSize = (pt * PT) + "px";
    e.style.left = x + "px";
    e.style.top = (base - 0.8375 * pt * PT) + "px";
    e.innerHTML = html;
    sheet.appendChild(e);
  }
  function buildSheet(d) {
    var s = document.getElementById("sheet");
    s.innerHTML = "";
    var parts = (d.issue_date || "").split("/");
    var day = parts[0] ? String(parseInt(parts[0], 10)) : "…", month = parts[1] ? String(parseInt(parts[1], 10)) : "…", year = parts[2] || "…";
    txt(s, "CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM", 559.2, 114.1, 13, "b");
    txt(s, "Độc lập – Tự do – Hạnh phúc", 721.2, 170.2, 14, "b");
    var ul = document.createElement("div"); ul.className = "ul"; ul.style.left = "728.1px"; ul.style.width = "613.5px"; ul.style.top = "186.1px"; s.appendChild(ul);
    var p = document.createElement("div");
    p.className = "p i";
    var size = 14 * PT, lh = 56.8;
    p.style.cssText = "left:411.9px;width:1543px;font-size:" + size + "px;line-height:" + lh + "px;top:" + (248.2 - ((lh - 1.107 * size) / 2 + 0.891 * size)) + "px";
    p.innerHTML = "Căn cứ Quyết định số " + esc(d.decision) + " ngày " + esc(d.issue_date) + " của Giám đốc Sở Xây dựng Bắc Ninh về việc cấp Giấy chứng nhận giáo viên dạy thực hành lái xe";
    s.appendChild(p);
    txt(s, "GIÁM ĐỐC SỞ XÂY DỰNG BẮC NINH", 600.1, 386.1, 15);
    txt(s, "CHỨNG NHẬN", 800.5, 466.7, 21, "b");
    txt(s, "Ông (bà): <span class=b>" + esc(d.name) + "</span>", 169.7, 658.6, 14);
    txt(s, "Ngày tháng năm sinh: " + esc(d.dob), 169.7, 721.4, 14);
    txt(s, "Số định danh điện tử: <span class=b>" + esc(d.cccd) + "</span>", 169.7, 786, 14);
    txt(s, "Đã hoàn thành khóa tập huấn giáo viên dạy thực hành lái xe ô tô hạng " + esc(d.training_class), 169.7, 842.8, 14);
    txt(s, "Từ ngày " + esc(d.begin) + " đến ngày " + esc(d.end) + ".", 169.7, 899.6, 14);
    txt(s, "Số GCN: " + esc(d.cert), 168.8, 998.7, 13);
    var sdx = (d.paper_qr && d.paper_qr.sign_dx ? d.paper_qr.sign_dx : 0) * 100;
    txt(s, "Bắc Ninh, ngày " + day + " tháng " + month + " năm " + esc(year), 943.2 + sdx, 998.7, 14, "i");
    txt(s, "TUQ. GIÁM ĐỐC", 1077 + sdx, 1055.5, 14, "b");
    txt(s, "TRƯỞNG PHÒNG VT&amp;ATGT", 935.9 + sdx, 1112.3, 14, "b");
    txt(s, "Nguyễn Thanh Phương", 1027.1 + sdx, 1428.8, 14, "b");
    // chỗ chữ ký và con dấu: dấu tích xanh "Đã ký"
    var sg = document.createElement("div"); sg.className = "signed";
    sg.style.cssText = "left:" + (1065 + sdx) + "px;top:1150px";
    sg.innerHTML = '<div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><b>Đã ký</b>';
    s.appendChild(sg);
    // mã QR quét không cần mạng (đúng vị trí trên giấy in)
    var q = d.paper_qr;
    if (q && q.png) {
      var qi = document.createElement("img"); qi.className = "qr"; qi.alt = "Mã QR quét không cần mạng";
      qi.src = "data:image/png;base64," + q.png;
      qi.style.cssText = "left:" + (q.x * 100) + "px;top:" + (q.y * 100) + "px;width:" + (q.size * 100) + "px;height:" + (q.size * 100) + "px";
      qi.addEventListener("click", function () {
        document.getElementById("qrZoomImg").src = qi.src;
        document.getElementById("qrZoom").classList.add("open");
        document.getElementById("qrZoomClose").focus();
      });
      s.appendChild(qi);
      if (q.caption) {
        var cap = document.createElement("div"); cap.className = "qr-cap";
        cap.style.cssText = "left:" + ((q.x + q.size / 2) * 100) + "px;top:" + ((q.y + q.size + 0.08) * 100) + "px;font-size:" + (8.5 * PT) + "px";
        cap.textContent = q.caption;
        s.appendChild(cap);
      }
    }
    var ph = document.createElement("div"); ph.className = "ph";
    ph.style.cssText = "left:120.1px;top:184.9px;width:237.8px;height:306.7px";
    if (d.photo) ph.innerHTML = '<img alt="" src="data:image/jpeg;base64,' + d.photo + '">';
    s.appendChild(ph);
    var wm = document.createElement("div"); wm.className = "wm"; wm.textContent = "BẢN XÁC MINH ĐIỆN TỬ"; s.appendChild(wm);
  }
  function fitSheet() {
    var area = document.getElementById("sheetArea"), wrap = document.getElementById("sheetScale"), s = document.getElementById("sheet");
    var k = Math.min((area.clientWidth - 16) / 2100, (area.clientHeight - 16) / 1480);
    k = Math.max(k, 0.1);
    s.style.transform = "scale(" + k + ")";
    wrap.style.width = (2100 * k) + "px";
    wrap.style.height = (1480 * k) + "px";
  }
  function openSheet() {
    document.getElementById("sheetWrap").classList.add("open");
    fitSheet();
    document.getElementById("closeSheet").focus();
  }
  document.getElementById("qrZoomClose").addEventListener("click", function () {
    document.getElementById("qrZoom").classList.remove("open");
  });
  document.getElementById("closeSheet").addEventListener("click", function () {
    document.getElementById("sheetWrap").classList.remove("open");
  });
  window.addEventListener("resize", function () {
    if (document.getElementById("sheetWrap").classList.contains("open")) fitSheet();
  });
})();
</script>
</body>
</html>
